name: Desktop release

# Builds the Tauri desktop app (apps/desktop) for Windows and macOS and attaches the
# installers to a draft GitHub Release. Review the draft, then publish it by hand.
#
# Release: bump "version" in apps/desktop/src-tauri/tauri.conf.json (plus package.json and
# Cargo.toml), commit, then `git tag v<version> && git push origin v<version>`.
# Manual run (Actions > Desktop release > Run workflow) uses the version in tauri.conf.json.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos-latest
            # One .dmg for Apple Silicon and Intel Macs.
            args: '--target universal-apple-darwin'

    runs-on: ${{ matrix.platform }}

    defaults:
      run:
        working-directory: apps/desktop

    # Compiled into the app. SIMJADWAL_API_URL is read by Rust (src-tauri/src/api/mod.rs),
    # VITE_REVERB_* by Vite. VITE_REVERB_APP_KEY must equal REVERB_APP_KEY on the server.
    env:
      SIMJADWAL_API_URL: ${{ secrets.SIMJADWAL_API_URL }}
      VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
      VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
      VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
      VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}

    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        shell: bash
        run: |
          for name in SIMJADWAL_API_URL VITE_REVERB_APP_KEY VITE_REVERB_HOST VITE_REVERB_PORT VITE_REVERB_SCHEME; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is not set (Settings > Secrets and variables > Actions)."
              exit 1
            fi
          done

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: v__VERSION__
          releaseName: SIMJADWAL v__VERSION__
          releaseBody: |
            Installer SIMJADWAL Desktop.
            - Windows: unduh file `.msi` atau `-setup.exe`.
            - macOS: unduh file `.dmg`. Aplikasi belum ditandatangani; buka lewat klik kanan > Open saat pertama kali dijalankan.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
