[supervisord]
nodaemon = true
user = root
logfile = /var/log/supervisor/supervisord.log
pidfile = /var/run/supervisord.pid


; ========================================================
; PHP-FPM
; ========================================================
[program:php-fpm]
command = php-fpm --nodaemonize
priority = 10
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0


; ========================================================
; NGINX
; ========================================================
[program:nginx]
command = nginx -g "daemon off;"
priority = 20
autostart = true
autorestart = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0


; ========================================================
; Laravel Reverb (websocket). Traefik routes /app and /apps to port 8080.
; No queue worker or scheduler: nothing is queued (ResourcesChanged uses
; ShouldBroadcastNow) and routes/console.php has no scheduled task.
; ========================================================
[program:laravel-reverb]
command = php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart = true
autorestart = true
stopasgroup = true
killasgroup = true
user = www-data
redirect_stderr = true
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stopwaitsecs = 10
